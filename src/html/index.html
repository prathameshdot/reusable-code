/* RESET */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{background:#f6f8fb;color:#333;line-height:1.6;}
.container{
  width:80%;                 /* wider container */
  max-width:1000px;          /* more horizontal room */
  margin-left:10px;          /* 🔥 pushes header LEFT */
  margin-right:auto;
}


.section{padding:90px 0;}
h2{text-align:center;font-size:34px;margin-bottom:50px;color:#111;}

/* ================= HEADER ================= */
.header{
  background:#ffffff; /* CHANGED TO WHITE */
  padding:16px 0;
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:1px solid #ddd;
  box-shadow: 0 2px 12px rgba(15,23,42,0.06);
  
}
.header-flex{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo img{
  height:55px;
  margin-right:20px;
}

/* NAV */
.nav{list-style:none;display:flex;align-items:center;}
.nav>li{position:relative;}
.nav>li>a{
  color:#000;                /* BLACK TEXT */
  padding:12px 18px;
  text-decoration:none;
  font-weight:500;
}
.nav>li>a:hover{color:#e53935;}

/* DROPDOWN */
.nav li ul{
  display:none;
  position:absolute;
  top:100%;
  left:0;
  min-width:260px;
  background:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  z-index:2000;
}
.nav li:hover>ul{display:block;}
.nav li ul li{position:relative;}
.nav li ul li a{
  background:#fff;
  color:#000;
  padding:12px 16px;
  display:block;
  border-bottom:1px solid #eee;
  text-decoration:none;
}
.nav li ul li a:hover{background:#000;color:#fff;}
/* SUB-CATEGORY DROPDOWN – RIGHT SIDE, STARTS BELOW PARENT */
/* SUB-CATEGORY DROPDOWN – OPENS TO THE RIGHT */
.nav li ul li ul{
  display:none;
  position:absolute;
  top:0;               /* ✅ aligns with parent item */
  left:100%;           /* ✅ opens to the right */
  min-width:260px;
  background:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  border-left:1px solid #ddd;
}


/* Show sub-category on hover */
.nav li ul li:hover > ul{
  display:block;
}

.nav li ul li:hover>ul{display:block;}
</style>

<style>
/* =========================
   GLOBAL STYLES
========================= */
body {

.highlights {

  transition: transform 0.3s, box-shadow 0.3s;
  border-bottom: 5px solid #2563eb;
}

.highlight-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 40px rgba(15,23,42,0.15);
}

.highlight-card h3 {
  color: #2563eb;

/* =========================

.why-choose {

.why-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));

.why-card::before {

  inset: 0;
  background: linear-gradient(135deg, #2563eb, #1e40af);
  opacity: 0;
  transition: opacity 0.35s;
}

.why-card:hover::before {
